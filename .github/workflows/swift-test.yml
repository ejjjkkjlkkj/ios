name: Swift and Firmware Audit CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Validate package
        run: swift package describe
      - name: Test core
        run: swift test
      - name: Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile firmware audit tool
        run: python -m py_compile Tools/firmware-audit/firmware_audit.py Tools/firmware-audit/test_firmware_audit.py
      - name: Test firmware audit tool
        run: python -m unittest discover -s Tools/firmware-audit -p 'test_*.py' -v
      - name: Check patch whitespace
        run: git diff --check
