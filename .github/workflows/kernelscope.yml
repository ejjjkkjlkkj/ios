name: KernelScope

on:
  push:
    paths:
      - "tools/kernelscope.py"
      - "tools/retrieve_kernelcache.py"
      - "tools/darwin_vm_audit.py"
      - "tests/**"
      - "docs/KERNELSCOPE.md"
      - "docs/IPHONE16_IOS27_KERNEL.md"
      - "docs/DARWIN_VM_INTEGRATION.md"
      - ".github/workflows/kernelscope.yml"
  pull_request:
    paths:
      - "tools/kernelscope.py"
      - "tools/retrieve_kernelcache.py"
      - "tools/darwin_vm_audit.py"
      - "tests/**"
      - "docs/KERNELSCOPE.md"
      - "docs/IPHONE16_IOS27_KERNEL.md"
      - "docs/DARWIN_VM_INTEGRATION.md"
      - "docs/JAILBREAK_RESEARCH_STATUS.md"
      - ".github/workflows/kernelscope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile tools/kernelscope.py tools/retrieve_kernelcache.py tools/darwin_vm_audit.py tests/test_kernelscope.py tests/test_retrieve_kernelcache.py tests/test_darwin_vm_audit.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
