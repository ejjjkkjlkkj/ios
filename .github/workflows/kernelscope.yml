name: KernelScope

on:
  push:
    paths:
      - "tools/kernelscope.py"
      - "tests/test_kernelscope.py"
      - ".github/workflows/kernelscope.yml"
  pull_request:
    paths:
      - "tools/kernelscope.py"
      - "tests/test_kernelscope.py"
      - ".github/workflows/kernelscope.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m py_compile tools/kernelscope.py tests/test_kernelscope.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_kernelscope.py" -v
